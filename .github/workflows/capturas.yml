name: Capturas
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python -u .github/capturas.py
        env: { PYTHONIOENCODING: utf-8 }
        timeout-minutes: 8
      - name: Subir capturas a la rama «capturas»
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/c && cp -r shots/. /tmp/c/ 2>/dev/null || true
          git config user.name PandxMax
          git config user.email 149822534+PandxMax@users.noreply.github.com
          git checkout --orphan capturas
          git rm -rfq . || true
          cp -r /tmp/c/. .
          git add -A
          git commit -qm "capturas" || true
          git push -f origin capturas
