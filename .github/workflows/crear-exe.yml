name: Crear EXE
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --name MusicManager --icon MusicManager.ico --hidden-import logo_data --hidden-import spectro --hidden-import i18n --hidden-import convert --collect-all imageio_ffmpeg --collect-submodules yt_dlp --hidden-import ytdl --hidden-import fx --hidden-import icons --hidden-import thumbs --hidden-import i18n_more --hidden-import dupes --hidden-import libtools --exclude-module tkinter --exclude-module matplotlib --exclude-module scipy --exclude-module pandas --exclude-module PIL --exclude-module unittest --exclude-module pydoc --exclude-module PyQt6.QtWebEngineCore --exclude-module PyQt6.QtQml --exclude-module PyQt6.QtQuick --exclude-module PyQt6.QtSql --exclude-module PyQt6.QtTest music_manager.py
      - name: Aligerar (quitar lo que no se usa)
        run: python .github/slim_build.py dist/MusicManager
      - uses: actions/upload-artifact@v4
        with: { name: MusicManager-Windows, path: dist/MusicManager }
      # Publica una "Release" con el zip: de ahí se actualiza el programa solo (Ayuda > Buscar actualizaciones)
      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path dist/MusicManager/* -DestinationPath MusicManager-Windows.zip -Force
      - name: Publicar versión
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 '^APP_VERSION' music_manager.py | sed 's/.*"\(.*\)".*/\1/')
          gh release delete "v$V" --yes --cleanup-tag || true
          gh release create "v$V" MusicManager-Windows.zip --title "Music Manager $V" --notes "Versión $V. Si ya tienes el programa, ábrelo y usa Ayuda > Buscar actualizaciones."
