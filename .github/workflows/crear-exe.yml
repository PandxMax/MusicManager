name: Crear EXE
on:
  workflow_dispatch:
  # cada vez que se sube una versión nueva del programa, el EXE se crea solo
  push:
    branches: [main]
    paths: ['**.py', 'requirements.txt', 'assets/**', '.github/workflows/crear-exe.yml', '.github/slim_build.py', '!.github/capturas.py']
concurrency:
  group: crear-exe
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - run: pyinstaller --noconfirm --clean --windowed --name MusicManager --icon assets/MusicManager.ico --paths src --hidden-import logo_data --hidden-import spectro --hidden-import i18n --hidden-import convert --collect-all imageio_ffmpeg --collect-submodules yt_dlp --hidden-import ytdl --hidden-import fx --hidden-import icons --hidden-import thumbs --hidden-import i18n_more --hidden-import dupes --hidden-import libtools --hidden-import mobile --hidden-import keydetect --hidden-import drawer --hidden-import upscale --hidden-import details --hidden-import genres --hidden-import taskbar --hidden-import folders_by --hidden-import navidrome --hidden-import picard_tools --hidden-import kofi_data --hidden-import covercrop --hidden-import repair --hidden-import miniplayer --hidden-import changelog --hidden-import secret --hidden-import smtc --collect-submodules winrt --collect-binaries winrt --hidden-import PyQt6.QtNetwork --exclude-module tkinter --exclude-module matplotlib --exclude-module scipy --exclude-module pandas --exclude-module PIL --exclude-module unittest --exclude-module pydoc --exclude-module PyQt6.QtWebEngineCore --exclude-module PyQt6.QtQml --exclude-module PyQt6.QtQuick --exclude-module PyQt6.QtSql --exclude-module PyQt6.QtTest src/music_manager.py
      - name: Aligerar (quitar lo que no se usa)
        run: python .github/slim_build.py dist/MusicManager
      - name: Incluir el analizador de audio fpcalc (Chromaprint, para Identificar por sonido)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip -OutFile fpcalc.zip
          $h = (Get-FileHash fpcalc.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "36b478e16aa69f757f376645db0d436073a42c0097b6bb2677109e7835b59bbc") { throw "fpcalc: hash inesperado $h" }
          Expand-Archive fpcalc.zip -DestinationPath fpcalc_tmp -Force
          Copy-Item (Get-ChildItem fpcalc_tmp -Recurse -Filter fpcalc.exe | Select-Object -First 1).FullName dist/MusicManager/_internal/fpcalc.exe
      - name: Comprobar que el EXE trae todo (aviso a Windows de la canción, reproductor, etc.)
        shell: pwsh
        run: |
          $env:MM_SELFTEST = "$PWD\selftest.txt"
          Start-Process -FilePath dist/MusicManager/MusicManager.exe -Wait
          Get-Content selftest.txt
          if (Select-String -Path selftest.txt -Pattern "FALLA" -Quiet) { throw "al EXE le falta algo" }
      - uses: actions/upload-artifact@v4
        with: { name: MusicManager-Windows, path: dist/MusicManager }
      # Publica una "Release" con el zip: de ahí se actualiza el programa solo (Ayuda > Buscar actualizaciones)
      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path dist/MusicManager/* -DestinationPath MusicManager-Windows.zip -Force
      - name: Publicar versión
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -m1 '^APP_VERSION' src/music_manager.py | sed 's/.*"\(.*\)".*/\1/')
          gh release delete "v$V" --yes --cleanup-tag || true
          gh release create "v$V" MusicManager-Windows.zip --title "Music Manager $V" --notes "Versión $V. Si ya tienes el programa, ábrelo y usa Ayuda > Buscar actualizaciones."
