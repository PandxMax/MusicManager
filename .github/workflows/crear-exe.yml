name: Crear EXE
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --name MusicManager --icon MusicManager.ico --hidden-import logo_data --hidden-import spectro --hidden-import ytview --hidden-import i18n --collect-all imageio_ffmpeg music_manager.py
      - uses: actions/upload-artifact@v4
        with: { name: MusicManager-Windows, path: dist/MusicManager }
